

services:
  ocr:
    build:
      context: ../../Microservicio-OCR
    container_name: ocr_service
    restart: unless-stopped
    environment:
      OCR_INTERNAL_API_KEY: ${OCR_INTERNAL_API_KEY:?Configure OCR_INTERNAL_API_KEY}
      OCR_MAX_FILE_SIZE_MB: ${OCR_MAX_FILE_SIZE_MB:-20}
      OCR_MAX_IMAGE_PIXELS: ${OCR_MAX_IMAGE_PIXELS:-40000000}
      OCR_MAX_IMAGE_SIDE: ${OCR_MAX_IMAGE_SIDE:-3000}
      OCR_RETRY_IMAGE_SIDE: ${OCR_RETRY_IMAGE_SIDE:-2200}
      OCR_MAX_PDF_PAGES: ${OCR_MAX_PDF_PAGES:-25}
      OCR_PDF_RENDER_DPI: ${OCR_PDF_RENDER_DPI:-200}
    ports:
      - "127.0.0.1:8000:8000"

  postgres:
    image: postgres:16
    container_name: ocr_postgres
    restart: always
    environment:
      POSTGRES_DB: ocr_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: ocr_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ocr_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  minio_data:
